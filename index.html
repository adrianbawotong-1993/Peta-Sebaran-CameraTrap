<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>camera_trap | AlTo</title>
    <link rel="apple-touch-icon" sizes="57x57" href="/assets/favicon/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/assets/favicon/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/assets/favicon/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/assets/favicon/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/assets/favicon/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/assets/favicon/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/assets/favicon/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/favicon/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="/assets/favicon/manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/assets/favicon/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100dvh - 56px);
            margin: 0;
        }

        #map {
            margin-top: 56px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
        <div class="container-fluid">
            <img src="assets/favicon/android-icon-192x192.png" alt="" style="height: 45px;">
            <a class="navbar-brand" href="#">Peta Sebaran Camera Trap AlTo </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="#" data-bs-toggle="modal"
                            data-bs-target="#aboutModal">Tentang</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- About Modal -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5">Tentang</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Ini adalah peta sebaran camera trap AlTo yang berinformasikan data satwa yang berhasil terekam.
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>
    <!-- Feature Modal -->
    <div class="modal fade" id="featureModal" tabindex="-1" aria-labelledby="featureModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="feature-title"></h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="feature-info">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <link rel="stylesheet"
        href="https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-locatecontrol/v0.43.0/L.Control.Locate.css">
    <script
        src="https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-locatecontrol/v0.43.0/L.Control.Locate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-0.779185945483018, 123.14573696064973], 11);

        // Tile Layer Basemap
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '© OpenStreetMap contributors',
        });

        var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri — Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        var rupabumiindonesia = L.tileLayer('https://geoservices.big.go.id/rbi/rest/services/BASEMAP/Rupabumi_Indonesia/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Sandhy_Adrian'
        });

        // Menambahkan basemap ke dalam peta
        rupabumiindonesia.addTo(map);
        // Menambahkan basemap ke dalam peta
        // GeoJSON Point
        var cameraTrap = L.geoJSON(null, {
            // Style
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: L.icon({
                        iconUrl: "assets/image/Camera-Icon-PNG-Image-Transparent-Background.png", // icon marker
                        iconSize: [20, 20], // ukuran icon
                        iconAnchor: [10, 10], // posisi icon terhadap titik (point)
                        popupAnchor: [0, -48], // posisi popup terhadap icon
                        tooltipAnchor: [5, -30], // posisi tooltip terhadap icon
                    }),
                });
            },

            // onEachFeature

            onEachFeature: function (feature, layer) {

                var popup = `<table class='table table-striped table-bordered table-condensed'>`

                function dataMuncul(_nama, _variable,) {
                    if (_variable != 0) {
                        return `<tr><th>` + _nama + `</th><td>` + _variable + ` </td></tr>`
                    } else {
                        return ''
                    }
                }

                var popup = popup + dataMuncul("Anjing", feature.properties.anjing)
                var popup = popup + dataMuncul("Anoa", feature.properties.anoa)
                var popup = popup + dataMuncul("Ayam Hutan", feature.properties.ayam_hutan)
                var popup = popup + dataMuncul("Babi Hutan", feature.properties.babi_hutan)
                var popup = popup + dataMuncul("Babirusa", feature.properties.babirusa)
                var popup = popup + dataMuncul("Biawak", feature.properties.biawak)
                var popup = popup + dataMuncul("Burung Tidak teridentifikasi", feature.properties.bird)
                var popup = popup + dataMuncul("Bubut Sulawesi", feature.properties.bubut_sulawesi)
                var popup = popup + dataMuncul("Delimukan Sulawesi", feature.properties.delimukan_sulawesi)
                var popup = popup + dataMuncul("Elang Alap Ekor Totol", feature.properties.elang_alap_ekor_totol)
                var popup = popup + dataMuncul("Elang Ular Sulawesi", feature.properties.elang_ular_sulawesi)
                var popup = popup + dataMuncul("Kadal", feature.properties.kadal)
                var popup = popup + dataMuncul("Kangkareng Sulawesi", feature.properties.kangkareng_sulawesi)
                var popup = popup + dataMuncul("Katak", feature.properties.katak)
                var popup = popup + dataMuncul("Kehicap Ranting", feature.properties.kehicap_ranting)
                var popup = popup + dataMuncul("Kelelawar", feature.properties.kelelawar)
                var popup = popup + dataMuncul("Kingfisher", feature.properties.kingfisher)
                var popup = popup + dataMuncul("Kupu-kupu", feature.properties.kupu_kupu)
                var popup = popup + dataMuncul("Kura-kura", feature.properties.kura_kura)
                var popup = popup + dataMuncul("Kuskus Beruang", feature.properties.kuskus_beruang)
                var popup = popup + dataMuncul("Lebah", feature.properties.lebah)
                var popup = popup + dataMuncul("Macaca", feature.properties.macaca)
                var popup = popup + dataMuncul("Maleo", feature.properties.maleo)
                var popup = popup + dataMuncul("Sulawesi Malkoha", feature.properties.malkoha)
                var popup = popup + dataMuncul("Mandar Padi Zebra", feature.properties.mandar_padi_zebra)
                var popup = popup + dataMuncul("Musang Sulawesi", feature.properties.musang_sulawesi)
                var popup = popup + dataMuncul("Musang Tenggalung", feature.properties.musang_tenggalung)
                var popup = popup + dataMuncul("Pelatuk Kelabu Sulawesi", feature.properties.pelatuk_kelabu_sulawesi)
                var popup = popup + dataMuncul("Rusa", feature.properties.rusa)
                var popup = popup + dataMuncul("Sapi", feature.properties.sapi)
                var popup = popup + dataMuncul("Serak Sulawesi", feature.properties.serak_sulawesi)
                var popup = popup + dataMuncul("Srigunting Sulawesi", feature.properties.srigunting_sulawesi)
                var popup = popup + dataMuncul("Tarsius", feature.properties.tarsius)
                var popup = popup + dataMuncul("Tikus", feature.properties.tikus)
                var popup = popup + dataMuncul("Tupai", feature.properties.tupai)
                var popup = popup + dataMuncul("Uncal Sultan", feature.properties.uncal_sultan)

                var popup = popup + `</table>`

                layer.on({

                    click: function (e) {
                        $("#feature-title").html(`Kamera ${feature.properties.nama_kamera}`); //Judul Modal
                        $("#feature-info").html(popup); //Isi Modal
                        $("#featureModal").modal("show"); //Menampilkan featureModal
                    },

                });
            },

        }).bindTooltip(function (layer) {
            return layer.feature.properties.nama_kamera
        })

        $.getJSON("assets/geojson/titik_kamera.geojson", function (data) {
            cameraTrap.addData(data); // Menambahkan data ke dalam point variable
            map.addLayer(cameraTrap); // Menambahkan GeoJSON Point ke dalam peta
        });

        var symbologyCategorized = { "tinggi": "#d95f0e", "sedang": "#fec44f", "rendah": "#fff7bc" };

        // jumlah penduduk
        map.createPane('paneJmlPddk');
        map.getPane("paneJmlPddk").style.zIndex = 301;
        var jumlah_penduduk = L.geoJSON(null, {
            pane: 'paneJmlPddk',
            // Style categorize

            // style: function (feature) {
            //     return {
            //         color: "yellow",
            //         opacity: 1,
            //         weight: 2,
            //         fillColor: symbologyCategorized[feature.properties.Kelas],
            //         fillOpacity: 0.8,
            //     };
            // },

            // style graduated
            style: function (feature) {
                if (feature.properties.JmlPddk <= 15000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#ffffb2'
                    }
                }
                if (feature.properties.JmlPddk > 15000 && feature.properties.JmlPddk <= 25000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#fd8d3c'
                    }
                }
                if (feature.properties.JmlPddk > 25000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#bd0026'
                    }
                }
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = `Kecamatan: ${feature.properties.NAMOBJ}<br>Jumlah Penduduk: ${feature.properties.JmlPddk} jiwa<br>Kelas: ${feature.properties.Kelas}`;

                layer.on({
                    click: function (e) {
                        $("#feature-title").html(`Kecamatan ${feature.properties.NAMOBJ}`); //Judul Modal
                        $("#feature-info").html(popup_content); //Isi Modal
                        $("#featureModal").modal("show"); //Menampilkan featureModal
                    }
                    // click: function (e) {
                    //     jumlah_penduduk.bindPopup(popup_content);
                    // },
                });
            },

            // filter: function (feature, layer) {
            //     return feature.properties.NAMOBJ == 'Luwuk Timur' || feature.properties.NAMOBJ == 'Moilong';
            // },
        });

        $.getJSON("assets/geojson/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data); // Menambahkan data ke dalam GeoJSON jumlah_penduduk
            // map.addLayer(jumlah_penduduk); // Menambahkan GeoJSON jumlah_penduduk ke dalam peta
        });

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri World Imagery": Esri_WorldImagery,
            "Rupa Bumi Indonesia": rupabumiindonesia,
        };

        var overlayMaps = {
            "Titik Kamera": cameraTrap,
            "Batas Kecamatan": jumlah_penduduk,

        };

        var controllayer = L.control.layers(baseMaps, overlayMaps, {
            collapsed: true
        });
        controllayer.addTo(map);

        // Scale
        var scale = L.control.scale({
            maxWidth: 50,
            imperial: false

        });
        scale.addTo(map);

        // Geolocation
        // map.locate({
        //     setView: true,
        //     maxZoom: 16,
        // });

        // Fungsi untuk menampilkan lokasi
        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            // Menampilkan marker pada lokasi
            L.marker(e.latlng).addTo(map).bindPopup("Anda berada dalam radius " + radius + " meter dari titik ini").openPopup();

            // Menampilkan circle pada lokasi
            L.circle(e.latlng, radius).addTo(map);
        }

        map.on("locationfound", onLocationFound);

        // Fungsi untuk menampilkan pesan error
        function onLocationError(e) {
            alert(e.message);
        }

        map.on("locationerror", onLocationError);

        /* Geolocation */
        var locateControl = L.control.locate({
            position: "topleft",
            drawCircle: true,
            follow: true,
            setView: true,
            keepCurrentZoomLevel: false,
            markerStyle: {
                weight: 1,
                opacity: 0.8,
                fillOpacity: 0.8,
            },
            circleStyle: {
                weight: 1,
                clickable: false,
            },
            icon: "fa fa-crosshairs",
            metric: true,
            strings: {
                title: "Klik untuk mengetahui lokasimu",
                popup: "Lokasimu sekarang di sini.Akurasi {distance} {unit}",
                outsideMapBoundsMsg: "Kamu berada di luar area peta"
            },
            locateOptions: {
                maxZoom: 15,
                watch: true,
                enableHighAccuracy: true,
                maximumAge: 10000,
                timeout: 10000
            }
        });
        locateControl.addTo(map);

    </script>
</body>

</html>
