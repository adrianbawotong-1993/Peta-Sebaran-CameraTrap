<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>camera_trap | AlTo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100dvh - 56px);
            margin: 0;
        }

        #map {
            margin-top: 56px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Peta Sebaran Camera Trap AlTo </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="#" data-bs-toggle="modal"
                            data-bs-target="#aboutModal">Tentang</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- About Modal -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5">Tentang</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Ini adalah peta sebaran camera trap AlTo yang berinformasikan data satwa yang berhasil terekam.
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>
    <!-- Feature Modal -->
    <div class="modal fade" id="featureModal" tabindex="-1" aria-labelledby="featureModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="feature-title"></h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="feature-info">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-0.779185945483018, 123.14573696064973], 11);

        // Tile Layer Basemap
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '© OpenStreetMap contributors',
        });

        var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri — Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        var rupabumiindonesia = L.tileLayer('https://geoservices.big.go.id/rbi/rest/services/BASEMAP/Rupabumi_Indonesia/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Sandhy_Adrianus Bawotong'
        });

        // Menambahkan basemap ke dalam peta
        rupabumiindonesia.addTo(map);
        // Menambahkan basemap ke dalam peta
        // GeoJSON Point
        var cameraTrap = L.geoJSON(null, {
            // Style
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: L.icon({
                        iconUrl: "assets/image/Camera-Icon-PNG-Image-Transparent-Background.png", // icon marker
                        iconSize: [20, 20], // ukuran icon
                        iconAnchor: [10, 10], // posisi icon terhadap titik (point)
                        popupAnchor: [0, -48], // posisi popup terhadap icon
                        tooltipAnchor: [-16, -30], // posisi tooltip terhadap icon
                    }),
                });
            },

            // onEachFeature

            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = `<table class='table table-striped table-bordered table-condensed'>
  <tr><th>Anjing</th><td>${feature.properties.anjing} </td></tr>
  <tr><th>Anoa</th><td>${feature.properties.anoa} </td></tr>
  <tr><th>Ayam Hutan</th><td>${feature.properties.ayam_hutan} </td></tr>
  <tr><th>Babi Hutan</th><td>${feature.properties.babi_hutan} </td></tr>
  <tr><th>Babirusa</th><td>${feature.properties.babirusa} </td></tr>
  <tr><th>Biawak</th><td>${feature.properties.biawak} </td></tr>
  <tr><th>Burung (Bird)</th><td>${feature.properties.bird} </td></tr>
  <tr><th>Bubut Sulawesi</th><td>${feature.properties.bubut_sulawesi} </td></tr>
  <tr><th>Delimukan Sulawesi</th><td>${feature.properties.delimukan_sulawesi} </td></tr>
  <tr><th>Elang Alap Ekor Totol</th><td>${feature.properties.elang_alap_ekor_totol} </td></tr>
  <tr><th>Elang Ular Sulawesi</th><td>${feature.properties.elang_ular_sulawesi} </td></tr>
  <tr><th>Kadal</th><td>${feature.properties.kadal} </td></tr>
  <tr><th>Kangkareng Sulawesi</th><td>${feature.properties.kangkareng_sulawesi} </td></tr>
  <tr><th>Katak</th><td>${feature.properties.katak} </td></tr>
  <tr><th>Kehicap Ranting</th><td>${feature.properties.kehicap_ranting} </td></tr>
  <tr><th>Kelelawar</th><td>${feature.properties.kelelawar} </td></tr>
  <tr><th>Kingfisher</th><td>${feature.properties.kingfisher} </td></tr>
  <tr><th>Kupu-kupu</th><td>${feature.properties["kupu-kupu"]} </td></tr>
  <tr><th>Kura-kura</th><td>${feature.properties["kura-kura"]} </td></tr>
  <tr><th>Kuskus Beruang</th><td>${feature.properties.kuskus_beruang} </td></tr>
  <tr><th>Lebah</th><td>${feature.properties.lebah} </td></tr>
  <tr><th>Macaca</th><td>${feature.properties.macaca} </td></tr>
  <tr><th>Maleo</th><td>${feature.properties.maleo} </td></tr>
  <tr><th>Malkoha</th><td>${feature.properties.malkoha} </td></tr>
  <tr><th>Mandar Padi Zebra</th><td>${feature.properties.mandar_padi_zebra} </td></tr>
  <tr><th>Manusia</th><td>${feature.properties.manusia} </td></tr>
  <tr><th>Musang Sulawesi</th><td>${feature.properties.musang_sulawesi} </td></tr>
  <tr><th>Musang Tenggalung</th><td>${feature.properties.musang_tenggalung} </td></tr>
  <tr><th>Pelatuk Kelabu Sulawesi</th><td>${feature.properties.pelatuk_kelabu_sulawesi} </td></tr>
  <tr><th>Pelatuk-kelabu Sulawesi (Varian)</th><td>${feature.properties["pelatuk-kelabu sulawesi"]} </td></tr>
  <tr><th>Rusa</th><td>${feature.properties.rusa} </td></tr>
  <tr><th>Sapi</th><td>${feature.properties.sapi} </td></tr>
  <tr><th>Serak Sulawesi</th><td>${feature.properties.serak_sulawesi} </td></tr>
  <tr><th>Srigunting Sulawesi</th><td>${feature.properties.srigunting_sulawesi} </td></tr>
  <tr><th>Tarsius</th><td>${feature.properties.tarsius} </td></tr>
  <tr><th>Tikus</th><td>${feature.properties.tikus} </td></tr>
  <tr><th>Tupai</th><td>${feature.properties.tupai} </td></tr>
  <tr><th>Uncal Sultan</th><td>${feature.properties.uncal_sultan} </td></tr>
  </table>`;
                layer.on({
                    click: function (e) {
                        $("#feature-title").html(`Kamera ${feature.properties.nama_kamera}`); //Judul Modal
                        $("#feature-info").html(popup_content); //Isi Modal
                        $("#featureModal").modal("show"); //Menampilkan featureModal
                    }
                });
            },

        });
        $.getJSON("assets/geojson/titik_kamera.geojson", function (data) {
            cameraTrap.addData(data); // Menambahkan data ke dalam point variable
            map.addLayer(cameraTrap); // Menambahkan GeoJSON Point ke dalam peta
        });

        var symbologyCategorized = { "tinggi": "#d95f0e", "sedang": "#fec44f", "rendah": "#fff7bc" };

        // jumlah penduduk
        map.createPane('paneJmlPddk');
        map.getPane("paneJmlPddk").style.zIndex = 301;
        var jumlah_penduduk = L.geoJSON(null, {
            pane: 'paneJmlPddk',
            // Style categorize

            // style: function (feature) {
            //     return {
            //         color: "yellow",
            //         opacity: 1,
            //         weight: 2,
            //         fillColor: symbologyCategorized[feature.properties.Kelas],
            //         fillOpacity: 0.8,
            //     };
            // },

            // style graduated
            style: function (feature) {
                if (feature.properties.JmlPddk <= 15000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#ffffb2'
                    }
                }
                if (feature.properties.JmlPddk > 15000 && feature.properties.JmlPddk <= 25000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#fd8d3c'
                    }
                }
                if (feature.properties.JmlPddk > 25000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#bd0026'
                    }
                }
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = `Kecamatan: ${feature.properties.NAMOBJ}<br>Jumlah Penduduk: ${feature.properties.JmlPddk} jiwa<br>Kelas: ${feature.properties.Kelas}`;

                layer.on({
                    click: function (e) {
                        $("#feature-title").html(`Kecamatan ${feature.properties.NAMOBJ}`); //Judul Modal
                        $("#feature-info").html(popup_content); //Isi Modal
                        $("#featureModal").modal("show"); //Menampilkan featureModal
                    }
                    // click: function (e) {
                    //     jumlah_penduduk.bindPopup(popup_content);
                    // },
                });
            },

            // filter: function (feature, layer) {
            //     return feature.properties.NAMOBJ == 'Luwuk Timur' || feature.properties.NAMOBJ == 'Moilong';
            // },
        });

        $.getJSON("assets/geojson/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data); // Menambahkan data ke dalam GeoJSON jumlah_penduduk
            // map.addLayer(jumlah_penduduk); // Menambahkan GeoJSON jumlah_penduduk ke dalam peta
        });

// Control Layer
var baseMaps = {
  "OpenStreetMap": osm,
  "Esri World Imagery": Esri_WorldImagery,
  "Rupa Bumi Indonesia": rupabumiindonesia,
};

var overlayMaps = {
"Titik Kamera" : cameraTrap,
"Batas Kecamatan" : jumlah_penduduk,

};

var controllayer = L.control.layers(baseMaps, overlayMaps, {collapsed:true
});
controllayer.addTo(map);

    </script>
</body>

</html>
